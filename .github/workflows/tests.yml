name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run deterministic unit and local integration tests
        # test_integration.py and captive_smoke make public-network calls and
        # run bandwidth/full diagnostics, so keep required CI reproducible.
        run: python -m pytest -q tests --ignore=tests/test_integration.py -k 'not captive_smoke'
